name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Wöchentlich neu bauen, damit neue Einträge aus PUB/ORCID automatisch erscheinen (Mo., 05:17 UTC).
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch publications (PUB / ORCID)
        run: npm run fetch:publications
        continue-on-error: true
        env:
          PUB_PERSON_ID: ${{ vars.PUB_PERSON_ID || '78762114' }}
          PUB_EXPORT_URL: ${{ vars.PUB_EXPORT_URL }}
          ORCID_ID: ${{ vars.ORCID_ID }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
